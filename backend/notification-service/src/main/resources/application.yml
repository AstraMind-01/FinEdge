server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:h2:mem:notification_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS notification_service}"
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
      default_schema: ${HIBERNATE_DEFAULT_SCHEMA:notification_service}
    properties:
      hibernate:
        default_schema: ${HIBERNATE_DEFAULT_SCHEMA:notification_service}
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.onlinebanking.notification.event,com.onlinebanking.transaction.event,*"

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

app:
  kafka:
    topics:
      transaction-events: transaction-events

# Step 15: Structured logging with correlation ID from MDC
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [cid=%X{correlationId:-none}] %-5level %logger{36} - %msg%n"
