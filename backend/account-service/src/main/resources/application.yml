server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:h2:mem:account_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS account_service}"
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
      default_schema: ${HIBERNATE_DEFAULT_SCHEMA:account_service}
    properties:
      hibernate:
        default_schema: ${HIBERNATE_DEFAULT_SCHEMA:account_service}
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
    show-sql: true

jwt:
  # Shared JWT secret for validating tokens issued by auth-service
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Step 15: Structured logging with correlation ID from MDC
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [cid=%X{correlationId:-none}] %-5level %logger{36} - %msg%n"
